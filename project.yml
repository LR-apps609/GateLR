name: GateLR
options:
  bundleIdPrefix: it.ledion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

# Versione unica per app e widget (si legge in Account → Versione)
settings:
  base:
    MARKETING_VERSION: "1.8.0"
    CURRENT_PROJECT_VERSION: "18"

targets:
  GateLR:
    type: application
    platform: iOS
    scheme: {}
    dependencies:
      - target: GateLRWidget          # widget per Home e schermata di blocco, incluso nell'app
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: NOVITA.txt
        buildPhase: resources
      # Le città: JSON costruiti dagli script in Tools/ dai dati aperti dei Comuni
      - path: Resources/Cities
        type: folder
        buildPhase: resources
      # Regole valide in tutta Italia (multe), le stesse del sito
      - path: Resources/Rules
        type: folder
        buildPhase: resources
      # Traduzioni (italiano, tedesco): generate da Tools/translations.py
      - path: Resources/Localizations
        buildPhase: resources
      # Titillium Web (SIL Open Font License)
      - path: Resources/Fonts
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: GateLR
        CFBundleName: GateLR
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it, de]
        # gatelr://now, gatelr://map, gatelr://trip: aperture dal widget e dal sito
        CFBundleURLTypes:
          - CFBundleURLName: it.ledion.GateLR
            CFBundleURLSchemes: [gatelr]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIAppFonts: [TitilliumWeb-Bold.ttf, TitilliumWeb-Black.ttf, TitilliumWeb-SemiBold.ttf]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHumanReadableCopyright: "Uso personale di Ledion"
        NSCameraUsageDescription: "GateLR reads the hours on the ZTL panel you point the camera at."
        NSLocationWhenInUseUsageDescription: "GateLR uses your location to tell you which ZTL gates are near you."
        # Navigazione: posizione e voce anche con lo schermo spento o un'altra app davanti
        UIBackgroundModes: [location, audio]
        NSSupportsLiveActivities: true
        NSLocationAlwaysAndWhenInUseUsageDescription: "GateLR warns you before a ZTL gate even when the app is closed."
        # CarPlay: la scena si attiva solo quando Apple concede l'autorizzazione «Driving Task»
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.GateLR
        PRODUCT_NAME: GateLR
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  # Widget: lo stato dei varchi del settore scelto, calcolato sul telefono
  GateLRWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Models.swift
      - path: Sources/RuleEngine.swift
      - path: Sources/SampleData.swift
      - path: Sources/Store.swift
      - path: Sources/Theme.swift
      - path: Sources/Components.swift
      - path: Sources/DriveActivity.swift
      - path: Resources/Cities
        type: folder
        buildPhase: resources
      - path: Resources/Localizations
        buildPhase: resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: GateLR
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.GateLR.Widget
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES

  # Test automatici del motore delle regole: girano sul Mac di GitHub a ogni modifica.
  GateLRTests:
    type: bundle.unit-test
    platform: iOS
    # Il codice dell'app compilato direttamente nei test (tranne il punto d'ingresso)
    sources:
      - path: Tests
      - path: Sources
        excludes:
          - "Main.swift"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.GateLRTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal

  # Giro dell'app nel simulatore con le foto di ogni schermata
  GateLRUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GateLR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.GateLRUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: GateLR

schemes:
  GateLRUITests:
    build:
      targets:
        GateLR: all
        GateLRUITests: [test]
    test:
      config: Debug
      targets:
        - GateLRUITests
  GateLRTests:
    build:
      targets:
        GateLRTests: [test]
    test:
      config: Debug
      targets:
        - GateLRTests
