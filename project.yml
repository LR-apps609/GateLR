name: GateLR
options:
  bundleIdPrefix: it.ledion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

targets:
  GateLR:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: NOVITA.txt
        buildPhase: resources
      # Le città: JSON costruiti dagli script in Tools/ dai dati aperti dei Comuni
      - path: Resources/Cities
        type: folder
        buildPhase: resources
      # Titillium Web (SIL Open Font License)
      - path: Resources/Fonts
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: GateLR
        CFBundleName: GateLR
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        UIAppFonts: [TitilliumWeb-Bold.ttf, TitilliumWeb-Black.ttf, TitilliumWeb-SemiBold.ttf]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHumanReadableCopyright: "Uso personale di Ledion"
        NSLocationWhenInUseUsageDescription: "GateLR uses your location to tell you which ZTL gates are near you."
        NSLocationAlwaysAndWhenInUseUsageDescription: "GateLR warns you before a ZTL gate even when the app is closed."
        # CarPlay: la scena si attiva solo quando Apple concede l'autorizzazione «Driving Task»
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.GateLR
        PRODUCT_NAME: GateLR
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  # Test automatici del motore delle regole: girano sul Mac di GitHub a ogni modifica.
  GateLRTests:
    type: bundle.unit-test
    platform: iOS
    # Il codice dell'app compilato direttamente nei test (tranne il punto d'ingresso)
    sources:
      - path: Tests
      - path: Sources
        excludes:
          - "Main.swift"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.GateLRTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal

  # Giro dell'app nel simulatore con le foto di ogni schermata
  GateLRUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GateLR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.GateLRUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: GateLR

schemes:
  GateLRUITests:
    build:
      targets:
        GateLR: all
        GateLRUITests: [test]
    test:
      config: Debug
      targets:
        - GateLRUITests
  GateLRTests:
    build:
      targets:
        GateLRTests: [test]
    test:
      config: Debug
      targets:
        - GateLRTests
