name: GateLR
options:
  bundleIdPrefix: it.ledion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

# Versione unica per app e widget (si legge in Account → Versione)
settings:
  base:
    MARKETING_VERSION: "1.14.2"
    CURRENT_PROJECT_VERSION: "30"

targets:
  GateLR:
    type: application
    platform: iOS
    dependencies:
      - target: GateLRWidget          # widget per Home e schermata di blocco, incluso nell'app
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: NOVITA.txt
        buildPhase: resources
      # Le città: JSON costruiti dagli script in Tools/ dai dati aperti dei Comuni
      - path: Resources/Cities
        type: folder
        buildPhase: resources
      # Semafori lungo le strade (OpenStreetMap, ODbL): disegnati nella vista «Guida 3D»
      - path: Resources/Signals
        type: folder
        buildPhase: resources
      # Parcheggi fuori dalle ZTL (OpenStreetMap, ODbL): Tools/fetch_parking.py + Tools/build_parking.py
      - path: Resources/Parking
        type: folder
        buildPhase: resources
      # Regole valide in tutta Italia (multe), le stesse del sito
      - path: Resources/Rules
        type: folder
        buildPhase: resources
      # Traduzioni (italiano, tedesco, francese, spagnolo, olandese, polacco, cinese): generate da Tools/translations.py
      - path: Resources/Localizations
        buildPhase: resources
      # Titillium Web e DotGothic16 (SIL Open Font License, OFL.txt e OFL-DotGothic16.txt)
      - path: Resources/Fonts
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: GateLR
        CFBundleName: GateLR
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, it, de, fr, es, nl, pl, zh-Hans]
        # gatelr://now, gatelr://map, gatelr://trip: aperture dal widget e dal sito
        CFBundleURLTypes:
          - CFBundleURLName: it.ledion.GateLR
            CFBundleURLSchemes: [gatelr]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIAppFonts: [TitilliumWeb-Bold.ttf, TitilliumWeb-Black.ttf, TitilliumWeb-SemiBold.ttf, TitilliumWeb-Regular.ttf, DotGothic16-Regular.ttf]
        # Schermata d'avvio con il marchio (prima era vuota: nera in modalità scura per tutto il caricamento).
        # La stessa la ridisegna LaunchSplash finché le città non sono lette, così il passaggio non si vede.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad: tutte le orientazioni (anche Split View e Slide Over); l'iPhone resta in verticale
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSHumanReadableCopyright: "Uso personale di Ledion"
        NSCameraUsageDescription: "GateLR reads the hours on the ZTL panel you point the camera at."
        NSLocationWhenInUseUsageDescription: "GateLR uses your location to tell you which ZTL gates are near you."
        # Navigazione: posizione e voce anche con lo schermo spento o un'altra app davanti
        UIBackgroundModes: [location, audio]
        NSSupportsLiveActivities: true
        NSLocationAlwaysAndWhenInUseUsageDescription: "GateLR warns you before a ZTL gate while you drive with another navigator, and when the app is closed."
        # CarPlay: la scena si attiva solo quando Apple concede l'autorizzazione «Driving Task»
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.GateLR
        PRODUCT_NAME: GateLR
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone e iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  # Widget: lo stato dei varchi del settore scelto, calcolato sul telefono
  GateLRWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Models.swift
      - path: Sources/RuleEngine.swift
      - path: Sources/SampleData.swift
      - path: Sources/Store.swift
      - path: Sources/Theme.swift
      - path: Sources/Components.swift
      - path: Sources/DriveActivity.swift
      - path: Resources/Cities
        type: folder
        buildPhase: resources
      - path: Resources/Localizations
        buildPhase: resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: GateLR
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.GateLR.Widget
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone e iPad
        APPLICATION_EXTENSION_API_ONLY: YES

  # Test automatici del motore delle regole: girano sul Mac di GitHub a ogni modifica.
  GateLRTests:
    type: bundle.unit-test
    platform: iOS
    # Il codice dell'app compilato direttamente nei test (tranne il punto d'ingresso)
    sources:
      - path: Tests
      - path: Sources
        excludes:
          - "Main.swift"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.GateLRTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal

  # Giro dell'app nel simulatore con le foto di ogni schermata
  GateLRUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GateLR
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.ledion.GateLRUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: GateLR

schemes:
  # ▶︎ in Xcode installa la versione ottimizzata (Release): quella di debug è molte volte più lenta sul telefono
  # (lettura delle città, mappe, calcoli a ogni posizione) e allungava l'avvio. La compilazione su GitHub sceglie
  # la configurazione da sé (-configuration Debug), quindi non cambia.
  GateLR:
    build:
      targets:
        GateLR: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Release
  GateLRUITests:
    build:
      targets:
        GateLR: all
        GateLRUITests: [test]
    test:
      config: Debug
      targets:
        - GateLRUITests
  GateLRTests:
    build:
      targets:
        GateLRTests: [test]
    test:
      config: Debug
      targets:
        - GateLRTests
