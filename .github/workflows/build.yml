# Compila GateLR su un Mac di GitHub a ogni modifica ed esegue i test del motore delle regole.
# Gli errori finiscono come «annotazioni» nella pagina della compilazione.
name: Compila GateLR

on:
  push:
    paths-ignore: ["web/**", "docs/**", "**.md", ".github/workflows/site.yml", ".github/workflows/sources.yml", "data/source-hashes.json", "Tools/check_sources.py", "android/**", "Tools/build_site.py", "Tools/translations.py", ".github/workflows/android.yml", ".github/workflows/geo.yml", "Tools/fetch_geo.py", "data/**", ".github/workflows/site-shots.yml", "Tools/site_shots.mjs", ".github/workflows/intro-routes.yml", "Tools/intro_routes.py"]   # il sito e i documenti non toccano l'app
  pull_request:
  workflow_dispatch:

# Una compilazione alla volta: se ne arrivano altre, resta in coda solo l'ultima
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write        # per pubblicare le foto dell'app nel ramo «screenshots»

jobs:
  build:
    # I Mac Apple Silicon di GitHub sono spesso esauriti: si usa il Mac Intel, come per AudioLR
    runs-on: macos-15-intel
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5

      - name: Xcode più recente disponibile
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: XcodeGen
        run: brew install xcodegen

      # Token pubblico di Mapbox dal segreto del repository MAPBOX_ACCESS_TOKEN, se c'è (mai nei file): senza, Mapbox è spento
      - name: Token Mapbox (facoltativo)
        env:
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          if [ -n "$MAPBOX_ACCESS_TOKEN" ]; then
            printf 'MAPBOX_ACCESS_TOKEN = %s\n' "$MAPBOX_ACCESS_TOKEN" > Config/Local.xcconfig
            echo "::notice::Mapbox acceso (segreto MAPBOX_ACCESS_TOKEN)"
          else
            echo "::notice::Nessun segreto MAPBOX_ACCESS_TOKEN: Mapbox spento, si usa la mappa di Apple"
          fi

      - name: Progetto
        run: xcodegen generate

      - name: Compilazione (simulatore iPhone, senza firma)
        run: |
          status=0
          xcodebuild -project GateLR.xcodeproj -scheme GateLR -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || status=$?
          grep -E "^/.*:[0-9]+:[0-9]+: (error|warning):" build.log | sort -u | head -n 40 | while IFS= read -r l; do
            f=$(echo "$l" | cut -d: -f1); n=$(echo "$l" | cut -d: -f2); k=$(echo "$l" | cut -d: -f4 | tr -d ' '); m=$(echo "$l" | cut -d: -f5-)
            echo "::$k file=${f#$GITHUB_WORKSPACE/},line=$n::$m"
          done
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -n 60 || true
          # Anche gli errori che non indicano un file (risorse, Info.plist, collegamento): come annotazioni
          grep -E "error:" build.log | grep -vE "^/.*:[0-9]+:[0-9]+: error:" | sort -u | head -n 8 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          exit $status

      - name: Versione dentro l'app
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/GateLR.app
          V=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist")
          W=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/PlugIns/GateLRWidget.appex/Info.plist")
          WANT=$(grep -m1 "MARKETING_VERSION" project.yml | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          echo "::notice::Versione app $V, widget $W (attesa $WANT)"
          test "$V" = "$WANT" && test "$W" = "$WANT"

      - name: Test automatici (motore delle regole)
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+[^()]*" | head -n 1 | sed 's/ *$//')
          echo "Simulatore: $SIM"
          status=0
          xcodebuild test -project GateLR.xcodeproj -scheme GateLRTests \
            -destination "platform=iOS Simulator,name=$SIM" -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || status=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed|TEST (SUCCEEDED|FAILED)" test.log | sort -u | head -n 80 || true
          grep -E "error:" test.log | sort -u | head -n 8 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          exit $status

      # Per installare dall'iPhone collegato a Windows con Sideloadly (vedi docs/windows.md): app per iPhone vero, senza firma
      - name: App per iPhone (.ipa per Sideloadly)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          V=$(grep -m1 "MARKETING_VERSION" project.yml | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          xcodebuild -project GateLR.xcodeproj -scheme GateLR -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > device.log 2>&1 \
            || { grep -E "error:" device.log | sort -u | head -n 8 | while IFS= read -r l; do echo "::error::${l:0:300}"; done; exit 1; }
          mkdir -p ipa/Payload && cp -R build-device/Build/Products/Release-iphoneos/GateLR.app ipa/Payload/
          (cd ipa && zip -qry "../GateLR-$V.ipa" Payload)
          echo "::notice::App per iPhone pronta: GateLR-$V.ipa ($(du -h "GateLR-$V.ipa" | cut -f1))"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: GateLR-iPhone-ipa
          path: GateLR-*.ipa
          if-no-files-found: warn

      - name: Foto dell'app (giro nel simulatore)
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+[^()]*" | head -n 1 | sed 's/ *$//')
          # Simulatore acceso prima dei test: al primo avvio a freddo l'app rischia il tempo scaduto
          xcrun simctl boot "$SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM" -b > /dev/null 2>&1 || true
          status=0
          xcodebuild test -project GateLR.xcodeproj -scheme GateLRUITests \
            -destination "platform=iOS Simulator,name=$SIM" -derivedDataPath build-ui \
            CODE_SIGNING_ALLOWED=NO TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots" > ui.log 2>&1 || status=$?
          grep -E "error:|Test Case .*(passed|failed)|TEST (SUCCEEDED|FAILED)" ui.log | sort -u | head -n 40 || true
          grep -E "error:|Test Case .*failed" ui.log | sort -u | head -n 10 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          ls -la screenshots || true
          if [ "$status" != 0 ]; then
            # Dove si è fermato: righe sospette e coda del registro come avvisi (i registri interi non si scaricano)
            grep -nE "hung|crash|Crash|Timed out|timed out|Failed to|failed:|not hittable|Unable|Assertion|Fatal|t =  .*(Tap|Find|Wait)" ui.log | tail -n 25 | while IFS= read -r l; do echo "::warning::${l:0:300}"; done
            tail -n 30 ui.log | while IFS= read -r l; do echo "::notice::${l:0:300}"; done
          fi
          exit $status

      - name: Pubblica le foto nel ramo «screenshots»
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p screenshots
          # Se il test non ha potuto scrivere le foto, si prendono dagli allegati del risultato
          if ! ls screenshots/*.png >/dev/null 2>&1; then
            RESULT=$(ls -d build-ui/Logs/Test/*.xcresult | head -n 1)
            xcrun xcresulttool export attachments --path "$RESULT" --output-path attachments || true
            python3 - <<'PY'
          import json, shutil, pathlib
          src = pathlib.Path("attachments"); out = pathlib.Path("screenshots")
          try:
              manifest = json.loads((src / "manifest.json").read_text())
              for test in manifest:
                  for a in test.get("attachments", []):
                      name = a.get("suggestedHumanReadableName", a["exportedFileName"]).split("_")[0]
                      shutil.copy(src / a["exportedFileName"], out / (name if name.endswith(".png") else name + ".png"))
          except Exception as e:
              print("allegati non letti:", e)
          PY
          fi
          N=$(ls screenshots/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "::notice::Foto dell'app: $N — $(ls screenshots | grep png | tr '\n' ' ' | cut -c1-900)"
          if [ "$N" -eq 0 ]; then echo "Nessuna foto da pubblicare"; exit 0; fi
          cd screenshots
          echo "Foto di $GITHUB_SHA ($(date -u +%Y-%m-%dT%H:%MZ))" > README.md
          git init -q && git checkout -q -b screenshots && git add .
          git -c user.name="GateLR CI" -c user.email="ci@gatelr.invalid" commit -qm "Foto dell'app per $GITHUB_SHA"
          set -o pipefail
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots 2>&1 | sed 's/x-access-token:[^@]*@/***@/' | tail -n 5 || { echo "::error::Push delle foto non riuscito"; exit 1; }

      # Prototipo della nuova presentazione: l'app avviata con -intro2 -intro2Autoplay va avanti da sola con i tempi di
      # una persona, mentre il simulatore registra lo schermo; poi la prima pagina ancora una volta con il disegno di
      # riserva (-intro2Fallback). Video e foto nel ramo «intro-video» (git fetch origin intro-video). Non blocca mai.
      - name: Video della nuova presentazione (prototipo)
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          # Ogni comando del simulatore con un tempo massimo: niente attese senza fine
          lim() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          SIM=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+[^()]*" | head -n 1 | sed 's/ *$//')
          UDID=$(xcrun simctl list devices booted | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}" | head -n 1)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | grep -F "$SIM (" | head -n 1 | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")
            lim 120 xcrun simctl boot "$UDID" || true
            lim 180 xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1 || true
          fi
          echo "::notice::Video: simulatore $SIM $UDID ($(date -u +%T))"
          [ -n "$UDID" ] || exit 1
          APP=build-ui/Build/Products/Debug-iphonesimulator/GateLR.app
          [ -d "$APP" ] || APP=build/Build/Products/Debug-iphonesimulator/GateLR.app
          lim 120 xcrun simctl install "$UDID" "$APP"
          echo "::notice::App installata ($(date -u +%T)) da $APP"
          lim 30 xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          lim 30 xcrun simctl terminate "$UDID" it.ledion.GateLR 2>/dev/null || true
          mkdir -p intro-video
          # Un primo giro non registrato: il simulatore senza scheda grafica scarica e prepara le mattonelle 3D di Firenze
          # (restano in cache), così nel video la mappa c'è da subito
          ARGS="-uitest -intro2 -intro2Autoplay -AppleLanguages (it) -AppleLocale it_IT"
          lim 60 xcrun simctl launch "$UDID" it.ledion.GateLR $ARGS || true
          sleep 45
          lim 30 xcrun simctl terminate "$UDID" it.ledion.GateLR || true
          sleep 2
          # Con il controllo dei processi (set -m) il registratore in sottofondo riceve davvero SIGINT
          # (senza, bash non interattivo gli fa ignorare SIGINT e il video non si chiude mai)
          set -m
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force intro-video/intro2.mp4 > rec.log 2>&1 &
          REC=$!
          set +m
          echo "::notice::Registrazione avviata ($(date -u +%T))"
          sleep 2
          shot() { lim 20 xcrun simctl io "$UDID" screenshot "intro-video/$1.png" > /dev/null 2>&1 || true; }
          # Aspetta fino a «secondi» dall'avvio dell'app
          at() { while [ $(( $(date +%s) - T0 )) -lt "$1" ]; do sleep 0.5; done; }
          T0=$(date +%s); lim 60 xcrun simctl launch "$UDID" it.ledion.GateLR $ARGS
          at 7; shot intro-1-verbale
          at 14; shot intro-2-parcheggio
          at 19; shot intro-3-a-piedi
          at 30; shot intro-4-avvisi
          at 36; shot intro-5-cartello
          at 40; shot intro-6-cartelli
          at 46; shot intro-7-dove-vai
          at 49
          lim 30 xcrun simctl terminate "$UDID" it.ledion.GateLR || true
          sleep 1
          T0=$(date +%s); lim 60 xcrun simctl launch "$UDID" it.ledion.GateLR $ARGS -intro2Fallback
          at 7; shot intro-8-riserva-verbale
          at 14; shot intro-9-riserva-parcheggio
          at 19; shot intro-10-riserva-a-piedi
          at 24
          kill -INT $REC 2>/dev/null || true
          for i in $(seq 1 40); do kill -0 $REC 2>/dev/null || break; sleep 0.5; done
          if kill -0 $REC 2>/dev/null; then echo "::warning::Il registratore non si è fermato con SIGINT"; kill -9 $REC || true; fi
          wait $REC 2>/dev/null || true
          tail -n 3 rec.log || true
          ls -la intro-video
          if [ ! -s intro-video/intro2.mp4 ]; then echo "::warning::Video della presentazione non registrato"; exit 1; fi
          # Più leggero per il push (avconvert è di macOS): 720p H.264
          if command -v avconvert > /dev/null; then
            lim 240 avconvert --source intro-video/intro2.mp4 --preset Preset1280x720 --output intro-small.mp4 --replace > /dev/null 2>&1 \
              && [ -s intro-small.mp4 ] && mv intro-small.mp4 intro-video/intro2.mp4 || echo "::warning::avconvert non riuscito, resta il video originale"
          fi
          echo "::notice::Video della presentazione: $(du -h intro-video/intro2.mp4 | cut -f1), $(ls intro-video | grep -c png) foto"
          cd intro-video
          echo "Prototipo -intro2 di $GITHUB_SHA ($(date -u +%Y-%m-%dT%H:%MZ)), $SIM" > README.md
          git init -q && git checkout -q -b intro-video && git add .
          git -c user.name="GateLR CI" -c user.email="ci@gatelr.invalid" commit -qm "Video della nuova presentazione per $GITHUB_SHA"
          for try in 1 2 3; do
            out=$(git -c http.postBuffer=157286400 push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" intro-video 2>&1) \
              && { echo "::notice::Video pubblicato nel ramo intro-video"; exit 0; }
            sleep 5
          done
          echo "::warning::Push del video non riuscito: $(echo "$out" | sed 's/x-access-token:[^@]*@/***@/' | tail -n 3 | tr '\n' ' ' | cut -c1-400)"; exit 1

      - name: Registri
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registri
          path: |
            build.log
            test.log
            ui.log
