name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "Resources/Cities/**", "Rules/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Test del motore (stesse regole dell'iPhone)
        run: gradle -p android/core test --no-daemon

      - name: Compila l'APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Lint
        run: gradle -p android :app:lintDebug --no-daemon
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: GateLR-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
