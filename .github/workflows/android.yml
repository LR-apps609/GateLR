name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "Resources/Cities/**", "Rules/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: write        # foto nel ramo «screenshots-android»

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Test del motore (stesse regole dell'iPhone)
        run: gradle -p android/core test --no-daemon

      - name: Compila l'APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Lint
        run: gradle -p android :app:lintDebug --no-daemon
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: GateLR-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Giro sull'emulatore (Android 14): apre le schede, fa le foto, controlla che non si chiuda
      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Giro sull'emulatore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/ci/tour.sh android-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-shots
          path: android-shots
      - name: Pubblica le foto nel ramo «screenshots-android»
        if: always() && github.ref == 'refs/heads/main'
        run: |
          ls android-shots/*.png >/dev/null 2>&1 || { echo "Nessuna foto"; exit 0; }
          cd android-shots && rm -f logcat.txt
          echo "Foto di $GITHUB_SHA ($(date -u +%Y-%m-%dT%H:%MZ))" > README.md
          git init -q && git checkout -q -b screenshots-android && git add .
          git -c user.name="GateLR CI" -c user.email="ci@gatelr.invalid" commit -qm "Foto Android per $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots-android 2>&1 | tail -n 3
